name: V3.22 Contact Credential Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-env-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment user and private contact configuration (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || '22' }}
          command_timeout: 60s
          script: |
            set -eu
            echo "SSH deployment user: $(id -un)"
            FILE="$HOME/hexasteel-v3/.env.contact"
            test -f "$FILE" || { echo "BLOCKED: contact env absent in deployment user HOME"; exit 1; }
            test -r "$FILE" || { echo "BLOCKED: contact env not readable"; exit 1; }
            test "$(stat -c %a "$FILE")" = "600" || { echo "BLOCKED: contact env permissions must be 600"; exit 1; }
            set -a
            . "$FILE"
            set +a
            for key in CONTACT_RESEND_API_KEY CONTACT_RESEND_FROM_EMAIL CONTACT_TURNSTILE_SITE_KEY CONTACT_TURNSTILE_SECRET_KEY; do
              eval 'test -n "${'"$key"':-}"' || { echo "BLOCKED: $key not populated"; exit 1; }
            done
            echo "PASS: contact settings are populated, accessible, and private (values not printed)"
            test -L "$HOME/hexasteel-v3/current"
            test -f "$HOME/hexasteel-v3/current/server.js"
            echo "PASS: existing application release path accessible"
