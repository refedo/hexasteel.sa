name: V3 foundation checks
on:
  push:
    branches: ["rebuild/**", "feature/**"]
  pull_request:
    branches: [main, "rebuild/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run generate:search
      - run: npm run check
      - run: npm run build
      - run: npm run test:rfq
      - run: npm run test:rfq-store
      - run: npm run test:rfq-worker
      - run: npm run test:search
