name: V3.16 public project CMS diagnostic (read-only)
on:
  push:
    branches: [feature/v316-project-cms-publishing]
    paths:
      - ".github/workflows/audit-v316-project-publication.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect published Sanity record and approval gates (read-only)
        env:
          SANITY_PROJECT_ID: ik7morln
          SANITY_DATASET: production
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          query='*[_type=="project" && publicSlug.current=="airport-infrastructure-steel"]{"id":_id,"approved":approvedForWeb==true,"privacy":identityClearedForWeb==true,"status":deliveryStatus,"hasImage":defined(coverImage.asset._ref)}'
          url=f'https://{os.environ["SANITY_PROJECT_ID"]}.api.sanity.io/v2025-02-01/data/query/{os.environ["SANITY_DATASET"]}?'+urllib.parse.urlencode({"query":query,"perspective":"published"})
          req=urllib.request.Request(url,headers={"User-Agent":"HEXA-CMS-Release-Audit/1.0"})
          with urllib.request.urlopen(req,timeout=18) as response:
            data=json.load(response)
          records=data.get("result",[])
          print("Public Sanity project match count:",len(records))
          for record in records:
            print("Project public-readiness:",json.dumps({
              "publishedRecordExists":not str(record.get("id","")).startswith("drafts."),
              "approvedForWeb":record.get("approved",False),
              "identityClearedForWeb":record.get("privacy",False),
              "deliveryStatus":record.get("status"),
              "coverImageReference":record.get("hasImage",False)
            }))
          if not records:
            print("No project with the website fallback slug is publicly readable; verify publicSlug and publication in Studio.")
          elif not all(p.get("approved") and p.get("privacy") for p in records):
            print("Some records are intentionally excluded by the public website visibility gates.")
          else:
            print("Public record meets both gates; investigate site cache/project fetch failure if content is stale.")
          PY
