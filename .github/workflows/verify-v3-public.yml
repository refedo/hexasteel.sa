name: Verify public HEXA V3 URL
on:
  push:
    branches: [rebuild/website-v3]
    paths: [.github/workflows/verify-v3-public.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify updated homepage, project/quality and insights
        run: |
          set -eu
          getent ahostsv4 hexasteel.sa >/dev/null
          check_route() {
            route="$1"
            dest="$(mktemp)"
            code="$(curl -LsS --connect-timeout 8 --max-time 25 -o "$dest" -w '%{http_code}' "https://hexasteel.sa/$route")"
            echo "/$route => $code"
            test "$code" = 200
            printf "%s\n" "$dest"
          }
          home="$(mktemp)"
          code="$(curl -LsS --connect-timeout 8 --max-time 25 -o "$home" -w '%{http_code}' https://hexasteel.sa/)"
          echo "Homepage => $code"
          test "$code" = 200
          grep -q "hero-slide-controls" "$home"
          grep -q "thousands of tonnes" "$home"
          grep -q "Our ambition" -i "$home"
          quality="$(mktemp)"
          test "$(curl -LsS --connect-timeout 8 --max-time 25 -o "$quality" -w '%{http_code}' https://hexasteel.sa/capabilities/quality)" = 200
          grep -q "Materials &amp; MIR" "$quality"
          grep -q "Dimensional" "$quality"
          grep -q "Surface &amp; Coating" "$quality"
          grep -q "Inspection" "$quality"
          projects="$(mktemp)"
          test "$(curl -LsS --connect-timeout 8 --max-time 25 -o "$projects" -w '%{http_code}' https://hexasteel.sa/projects)" = 200
          grep -q "MAPA" "$projects"
          grep -q "NADEC" "$projects"
          grep -q "Red Sea Global" "$projects"
          insights="$(mktemp)"
          test "$(curl -LsS --connect-timeout 8 --max-time 25 -o "$insights" -w '%{http_code}' https://hexasteel.sa/insights)" = 200
          grep -q "SIRI" "$insights"
          test "$(curl -LsS --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' https://hexasteel.sa/insights/siri-assessment-2025)" = 200
          echo "SUCCESS: externally verified V3.6 pages and interactive content"
