name: Verify public HEXA V3 URL
on:
  push:
    branches: [rebuild/website-v3]
    paths: [.github/workflows/verify-v3-public.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify external DNS, homepage and content routes
        run: |
          set -eu
          getent ahostsv4 hexasteel.sa >/dev/null
          body="$(mktemp)"
          response="$(curl -L -sS --connect-timeout 8 --max-time 25 -o "$body" -w '%{http_code}' https://hexasteel.sa/)"
          echo "Public homepage HTTP status: $response"
          test "$response" = 200
          grep -q "Two equally important disciplines" "$body"
          grep -q "Engineering · Manufacturing" "$body" || grep -q "Project Delivery" "$body"
          for route in projects project-delivery insights capabilities/machinery capabilities/coating capabilities/quality company/operational-excellence knowledge knowledge/structural-steel-vs-peb; do
            status="$(curl -L -sS --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' "https://hexasteel.sa/$route")"
            echo "/$route => $status"
            test "$status" = 200
          done
          echo "SUCCESS: external HTTPS confirms revised multipage Hexa V3"
